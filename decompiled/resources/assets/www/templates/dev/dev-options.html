nary" value="binary"><label for="dev-storage-data-type-binary">バイナリ</label></fieldset></form></div><h3>device:local-storage 特別設定</h3><fieldset class="fes-match-parent" data-role="controlgroup" data-type="horizontal" data-mini="true"><div class="fes-center-container ui-corner-all"><input type="radio" name="dev-radio-group-device-storage-root" id="dev-device-storage-root-data" value="dataDirectory" checked="checked"><label for="dev-device-storage-root-data">dataDirectory</label><input type="radio" name="dev-radio-group-device-storage-root" id="dev-device-storage-root-external" value="externalRootDirectory"><label for="dev-device-storage-root-external">externalRootDirectory</label></div></fieldset><fieldset class="fes-match-parent" data-role="controlgroup" data-mini="true"><button class="dev-command-storage ui-btn ui-corner-all" data-action="set">setItem()</button> <button class="dev-command-storage ui-btn ui-corner-all" data-action="get">getItem()</button> <button class="dev-command-storage ui-btn ui-corner-all" data-action="remove">removeItem()</button> <button class="dev-command-storage ui-btn ui-corner-all" data-action="clear">clear()</button></fieldset><div class="dev-storage-output"></div><hr><h3>Home 画面のコントローラートランジション</h3><fieldset class="fes-match-parent" data-role="controlgroup" data-mini="true"><input type="radio" name="dev-radio-group-homectrl-trans-kind" id="dev-homectrl-trans-gm1" value="trans:gm1" checked="checked"><label for="dev-homectrl-trans-gm1">GM1</label><input type="radio" name="dev-radio-group-homectrl-trans-kind" id="dev-homectrl-trans-fade" value="trans:fade"><label for="dev-homectrl-trans-fade">フェード</label><input type="radio" name="dev-radio-group-homectrl-trans-kind" id="dev-homectrl-trans-none" value="trans:none"><label for="dev-homectrl-trans-none">なし</label></fieldset><hr><h3>変換スキンデータのダウンロード:</h3><button class="dev-command-download-test ui-btn ui-corner-all">ダウンロード</button><hr><h3>サンプルスキンデータ作成:</h3><button class="dev-command-convert-test-t
